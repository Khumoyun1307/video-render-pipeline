name: Render
run-name: Render ${{ inputs.production }} ${{ inputs.only }}

# Started by hand only (node tools/cloud.mjs render <production>, or the "Run workflow" button).
# A push never starts a render.
on:
  workflow_dispatch:
    inputs:
      production:
        description: Folder under productions/
        required: true
        default: pipeline-test
      only:
        description: Optional. Render only these projects (space separated, for example "ch03 ch07")
        required: false
        default: ""
      skip_check:
        description: Skip "hyperframes check" before rendering
        type: boolean
        default: false

permissions:
  contents: read

env:
  HF_VERSION: "0.9.72"            # pinned. Keep equal to HF_VERSION in tools/lib.mjs.
  HYPERFRAMES_NO_TELEMETRY: "1"
  PRODUCTION: ${{ inputs.production }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Guard (nothing forbidden is in the repository)
        run: node tools/guard.mjs --tracked
      - name: List the render jobs
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: node tools/plan.mjs "$PRODUCTION" --github --only "$ONLY"
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.json
          retention-days: 1

  render:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache HyperFrames browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-${{ env.HF_VERSION }}-${{ runner.os }}
      - name: Install HyperFrames ${{ env.HF_VERSION }}, ffmpeg, browser
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          # headless Chrome needs unprivileged user namespaces, which Ubuntu 24.04 restricts by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install --global --silent "hyperframes@${HF_VERSION}"
          hyperframes --version
          hyperframes browser ensure
          ffmpeg -version | head -n 1
          nproc && free -g | sed -n 2p
      - name: Prepare the project (kit copy, vendor files)
        env:
          PROJECT: ${{ matrix.project }}
        run: node tools/prepare.mjs "$PRODUCTION" "$PROJECT"
      - name: Check
        if: ${{ matrix.check && !inputs.skip_check }}
        working-directory: productions/${{ inputs.production }}/${{ matrix.project }}
        run: hyperframes check --no-browser-gpu --no-craft
      - name: Render
        id: render
        working-directory: productions/${{ inputs.production }}/${{ matrix.project }}
        env:
          ID: ${{ matrix.id }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          FRAMES: ${{ matrix.frames }}
        run: |
          set -euo pipefail
          plan="$(node "$GITHUB_WORKSPACE/tools/plan.mjs" "$PRODUCTION")"
          fps="$(node -p 'JSON.parse(process.argv[1]).fps' "$plan")"
          quality="$(node -p 'JSON.parse(process.argv[1]).quality' "$plan")"
          workers="$(node -p 'JSON.parse(process.argv[1]).workers' "$plan")"
          mkdir -p "$GITHUB_WORKSPACE/out"
          out="$GITHUB_WORKSPACE/out/$ID.mp4"
          args=(render -f "$fps" -q "$quality" -w "$workers" --no-browser-gpu -o "$out")
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          if [ -n "$END" ]; then args+=(--end "$END"); fi
          echo "hyperframes ${args[*]}"
          t0=$(date +%s)
          hyperframes "${args[@]}"
          secs=$(( $(date +%s) - t0 ))
          got=$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 "$out")
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate -of default=nw=1 "$out"
          per=$(node -p "($secs / ($got / $fps)).toFixed(2)")
          echo "| $ID | $got frames | render ${secs} s | ${per} s per finished second |" >> "$GITHUB_STEP_SUMMARY"
          echo "render_seconds=$secs frames=$got per_finished_second=$per"
          if [ "$got" != "$FRAMES" ]; then echo "::error::$ID has $got frames, the plan needs $FRAMES"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: part-${{ matrix.id }}
          path: out/${{ matrix.id }}.mp4
          retention-days: 1          # the local script downloads the files and then deletes them from GitHub
          compression-level: 0
          if-no-files-found: error

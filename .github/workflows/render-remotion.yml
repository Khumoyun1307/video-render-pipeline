name: Render (Remotion)
run-name: Render ${{ inputs.production }} ${{ inputs.only }}

# Started by hand only (node tools/cloud.mjs render <production>, or the "Run workflow" button).
# For productions whose pipeline.json says "engine": "remotion". A push never starts a render.
on:
  workflow_dispatch:
    inputs:
      production:
        description: Folder under productions/
        required: true
        default: remotion-test
      only:
        description: Optional. Render only these compositions (space separated, for example "Intro Outro")
        required: false
        default: ""

permissions:
  contents: read

env:
  REMOTION_VERSION: "4.0.540"     # pinned. Keep equal to ENGINES.remotion in tools/lib.mjs and the production's package.json.
  PRODUCTION: ${{ inputs.production }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Guard (nothing forbidden is in the repository)
        run: node tools/guard.mjs --tracked
      - name: List the render jobs
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: node tools/plan.mjs "$PRODUCTION" --github --engine remotion --only "$ONLY"
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.json
          retention-days: 1

  render:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: productions/${{ inputs.production }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # node_modules (with Remotion's own headless Chrome and ffmpeg inside it) is restored whole when the
      # lockfile has not changed; otherwise it is installed from the lockfile and saved for the next run.
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v6
        with:
          path: productions/${{ inputs.production }}/node_modules
          key: remotion-deps-${{ runner.os }}-node22-${{ hashFiles(format('productions/{0}/package-lock.json', inputs.production)) }}
      - name: Install from the lockfile, and the browser
        env:
          HIT: ${{ steps.deps.outputs.cache-hit }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          if [ "$HIT" != "true" ]; then npm ci --no-audit --no-fund; fi
          # headless Chrome needs unprivileged user namespaces, which Ubuntu 24.04 restricts by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx remotion browser ensure
          npx remotion versions
          have="$(node -p 'require("remotion/package.json").version')"
          if [ "$have" != "$REMOTION_VERSION" ]; then echo "::warning::installed remotion $have, the pipeline pins $REMOTION_VERSION"; fi
          echo "install_seconds=$(( $(date +%s) - t0 )) (cache hit: ${HIT:-false})"
          nproc && free -g | sed -n 2p
      - name: Render
        env:
          ID: ${{ matrix.id }}
          COMPOSITION: ${{ matrix.project }}
          RANGE: ${{ matrix.range }}
          FRAMES: ${{ matrix.frames }}
        run: |
          set -euo pipefail
          plan="$(node "$GITHUB_WORKSPACE/tools/plan.mjs" "$PRODUCTION" 2>/dev/null)"
          get() { node -p "JSON.parse(process.argv[1]).$1" "$plan"; }
          fps="$(get fps)"; workers="$(get workers)"; entry="$(get entry)"; width="$(get width)"; height="$(get height)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          out="$GITHUB_WORKSPACE/out/$ID.mp4"
          args=(remotion render "$entry" "$COMPOSITION" "$out" --codec=h264 --muted --concurrency="$workers" --overwrite --log=info)
          if [ -n "$RANGE" ]; then args+=(--frames="$RANGE"); fi
          echo "npx ${args[*]}"
          t0=$(date +%s)
          npx "${args[@]}"
          secs=$(( $(date +%s) - t0 ))
          # Remotion ships its own ffprobe; the runner image does not have to.
          probe() { npx remotion ffprobe -v error -select_streams v:0 "$@" "$out"; }
          got=$(probe -count_packets -show_entries stream=nb_read_packets -of csv=p=0)
          probe -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate -of default=nw=1
          size=$(probe -show_entries stream=width,height -of csv=p=0:s=x)
          rate=$(probe -show_entries stream=r_frame_rate -of csv=p=0)
          per=$(node -p "($secs / ($got / $fps)).toFixed(2)")
          echo "| $ID | $got frames | render ${secs} s (bundle included) | ${per} s per finished second |" >> "$GITHUB_STEP_SUMMARY"
          echo "render_seconds=$secs frames=$got per_finished_second=$per"
          if [ "$got" != "$FRAMES" ]; then echo "::error::$ID has $got frames, the plan needs $FRAMES (is the composition's length in pipeline.json right?)"; exit 1; fi
          if [ "$size" != "${width}x${height}" ]; then echo "::error::$ID is $size, the production's format needs ${width}x${height}"; exit 1; fi
          if [ "$rate" != "$fps/1" ]; then echo "::error::$ID runs at $rate fps, the production needs $fps"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: part-${{ matrix.id }}
          path: out/${{ matrix.id }}.mp4
          retention-days: 1          # the local script downloads the files and then deletes them from GitHub
          compression-level: 0
          if-no-files-found: error
